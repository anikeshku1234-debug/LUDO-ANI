<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Ludo Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; width: 100%; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-top: 40px; }
    h1 { font-size: 24px; margin-bottom: 15px; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-join { background: #0284c7; color: white; }
    .btn-join:hover { background: #0369a1; }
    
    #gameArea { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 440px; }
    .status-bar { background: #1e293b; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 12px; border: 1px solid #334155; font-size: 15px; text-align: center; }
    
    /* 15x15 Ludo Board */
    #board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      background: #ffffff;
      border: 3px solid #334155;
      border-radius: 8px;
      position: relative;
    }

    .cell { border: 0.5px solid #cbd5e1; position: relative; }
    
    /* Quadrants / Ghar */
    .home-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #ef4444; border: 16px solid #fee2e2; }
    .home-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #22c55e; border: 16px solid #dcfce7; }
    .home-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: #eab308; border: 16px solid #fef9c3; }
    .home-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: #3b82f6; border: 16px solid #dbeafe; }
    .center-box { grid-column: 7 / 10; grid-row: 7 / 10; background: conic-gradient(#ef4444 0deg 90deg, #22c55e 90deg 180deg, #eab308 180deg 270deg, #3b82f6 270deg 360deg); }

    /* Colored Tracks */
    .cell.path-red { background: #fee2e2; }
    .cell.path-green { background: #dcfce7; }
    .cell.path-yellow { background: #fef9c3; }
    .cell.path-blue { background: #dbeafe; }
    .cell.safe-red { background: #ef4444 !important; }
    .cell.safe-green { background: #22c55e !important; }
    .cell.safe-yellow { background: #eab308 !important; }
    .cell.safe-blue { background: #3b82f6 !important; }

    /* Controls */
    .controls { width: 100%; display: flex; gap: 10px; margin-top: 15px; align-items: center; }
    .dice-box {
      flex: 1;
      height: 52px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
    }
    .btn-roll {
      flex: 2;
      height: 52px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-roll:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Join Room Form -->
  <div class="card" id="joinCard">
    <h1>Ludo Multiplayer</h1>
    <input type="text" id="playerName" placeholder="Apna Naam Likhein" />
    <input type="text" id="roomCode" placeholder="Room Code (jaise 101)" />
    <button class="btn-join" id="joinBtn">Room Join / Create Karein</button>
  </div>

  <!-- Game Board Screen -->
  <div id="gameArea">
    <div class="status-bar" id="statusBar">Players jud rahe hain...</div>
    <div id="board"></div>
    <div class="controls">
      <div class="dice-box" id="diceDisplay">-</div>
      <button class="btn-roll" id="rollBtn" disabled>Pasa Phenkein</button>
    </div>
  </div>

  <script>
    // Direct connect to active server
    const socket = io();

    // 15x15 Board Generation
    const boardEl = document.getElementById('board');
    for (let r = 1; r <= 15; r++) {
      for (let c = 1; c <= 15; c++) {
        if ((r <= 6 && c <= 6) || (r <= 6 && c >= 10) || 
            (r >= 10 && c <= 6) || (r >= 10 && c >= 10) || 
            (r >= 7 && r <= 9 && c >= 7 && c <= 9)) {
          continue;
        }
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.gridRow = r;
        cell.style.gridColumn = c;

        // Path Highlights
        if (r === 8 && c >= 2 && c <= 6) cell.classList.add('safe-red');
        if (c === 8 && r >= 2 && r <= 6) cell.classList.add('safe-green');
        if (r === 8 && c >= 10 && c <= 14) cell.classList.add('safe-yellow');
        if (c === 8 && r >= 10 && r <= 14) cell.classList.add('safe-blue');
        if (r === 7 && c === 2) cell.classList.add('safe-red');
        if (r === 2 && c === 9) cell.classList.add('safe-green');
        if (r === 9 && c === 14) cell.classList.add('safe-yellow');
        if (r === 14 && c === 7) cell.classList.add('safe-blue');

        boardEl.appendChild(cell);
      }
    }

    // 4 Ghar aur Center
    ['home-red', 'home-green', 'home-yellow', 'home-blue', 'center-box'].forEach(cls => {
      const box = document.createElement('div');
      box.className = cls;
      boardEl.appendChild(box);
    });

    // Button Events
    document.getElementById('joinBtn').addEventListener('click', () => {
      const name = document.getElementById('playerName').value.trim();
      const room = document.getElementById('roomCode').value.trim();
      if (!name || !room) {
        alert('Naam aur Room Code dono daalein!');
        return;
      }
      socket.emit('joinRoom', { playerName: name, roomCode: room });
    });

    document.getElementById('rollBtn').addEventListener('click', () => {
      socket.emit('rollDice');
    });

    // Server Listeners
    socket.on('roomJoined', (data) => {
      document.getElementById('joinCard').style.display = 'none';
      document.getElementById('gameArea').style.display = 'flex';
    });

    socket.on('updateState', (state) => {
      const me = state.players.find(p => p.id === socket.id);
      const activePlayer = state.players.find(p => p.id === state.currentTurn);

      if (state.lastRoll) {
        document.getElementById('diceDisplay').innerText = state.lastRoll;
      }

      const isMyTurn = (socket.id === state.currentTurn);
      const rollBtn = document.getElementById('rollBtn');
      rollBtn.disabled = !isMyTurn;

      const statusBar = document.getElementById('statusBar');
      if (isMyTurn) {
        statusBar.innerHTML = `<span style="color:#38bdf8; font-weight:bold;">Aapki Baari Hai (${me ? me.color.toUpperCase() : ''})! Pasa Phenkein.</span>`;
      } else {
        statusBar.innerHTML = `Baari: <strong style="color:orange;">${activePlayer ? activePlayer.name : ''} (${activePlayer ? activePlayer.color.toUpperCase() : ''})</strong> ki hai...`;
      }
    });

    socket.on('gameError', (msg) => alert(msg));
  </script>
</body>
</html>
