<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo Multiplayer</title>

  <!-- PWA Meta Tags & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <meta name="theme-color" content="#0284c7">

  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --red: #dc2626;
      --green: #16a34a;
      --yellow: #facc15;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle, #1e40af, #0f172a);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow-x: hidden; color: white;
    }
    .panel {
      background: rgba(30, 41, 59, 0.95); border: 2px solid #38bdf8;
      border-radius: 16px; padding: 24px; width: 90%; max-width: 400px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .btn {
      width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-green { background: #16a34a; color: white; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-ai { background: #9333ea; color: white; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
      border: 2px solid #64748b; background: #0f172a; color: white; font-size: 16px;
    }
    #gameArea { display: none; flex-direction: column; align-items: center; }
    
    /* Board Layout - Photo Authentic */
    #board {
      width: 92vw; max-width: 420px; height: 92vw; max-height: 420px;
      display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
      background: #ffffff; border: 4px solid #0f172a; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      position: relative;
    }
    .cell { border: 0.5px solid #cbd5e1; position: relative; display: flex; align-items: center; justify-content: center; }
    .home-box { position: absolute; border: 4px solid #0f172a; display: grid; place-items: center; }
    .home-inner { width: 68%; height: 68%; background: white; border-radius: 12px; border: 3px solid rgba(0,0,0,0.2); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; place-items: center; }
    
    .hb-red { top: 0; left: 0; width: 40%; height: 40%; background: var(--red); }
    .hb-green { top: 0; right: 0; width: 40%; height: 40%; background: var(--green); }
    .hb-blue { bottom: 0; left: 0; width: 40%; height: 40%; background: var(--blue); }
    .hb-yellow { bottom: 0; right: 0; width: 40%; height: 40%; background: var(--yellow); }

    /* Center Triangle */
    .center-finish {
      position: absolute; top: 40%; left: 40%; width: 20%; height: 20%;
      background: conic-gradient(var(--green) 0deg 90deg, var(--yellow) 90deg 180deg, var(--blue) 180deg 270deg, var(--red) 270deg 360deg);
      border: 2px solid #0f172a;
    }

    /* Coloured Star / Safe Stamps (Photo Style) */
    .safe-stamp {
      width: 80%; height: 80%; border-radius: 50%; opacity: 0.85;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: white;
    }
    .stamp-red { background: var(--red); }
    .stamp-green { background: var(--green); }
    .stamp-yellow { background: var(--yellow); }
    .stamp-blue { background: var(--blue); }

    /* Goti (Token Pin Look) */
    .pin {
      width: 80%; height: 80%; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); cursor: pointer; border: 2px solid white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5); z-index: 10;
    }
    .pin-red { background: #ef4444; }
    .pin-green { background: #22c55e; }
    .pin-yellow { background: #eab308; }
    .pin-blue { background: #3b82f6; }

    /* Controls */
    .controls-bar {
      margin-top: 15px; display: flex; gap: 15px; align-items: center; justify-content: space-between;
      background: #1e293b; padding: 12px 20px; border-radius: 12px; width: 92vw; max-width: 420px;
    }
    .dice-btn {
      padding: 12px 24px; font-size: 20px; font-weight: bold; border-radius: 10px;
      border: 3px solid #facc15; background: white; color: #0f172a; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Menu View -->
  <div id="menuView" class="panel">
    <h1 style="margin-bottom:15px; color:#38bdf8;">🎲 LUDO ROYALE</h1>
    <input id="nameInput" placeholder="Apna Naam Likhein" />
    <button class="btn btn-ai" onclick="startAI()">🤖 Play vs Computer (AI)</button>
    <button class="btn btn-green" onclick="createRoom()">🏠 Create Online Room</button>
    <div style="margin: 10px 0; font-size: 12px; color:#94a3b8;">— YA CODE SE JOIN KAREIN —</div>
    <input id="codeInput" placeholder="4-Digit Code" maxlength="4" />
    <button class="btn btn-blue" onclick="joinRoom()">🔑 Join Room</button>
  </div>

  <!-- Game Area -->
  <div id="gameArea">
    <div id="board">
      <div class="home-box hb-red"><div class="home-inner" id="base-red"></div></div>
      <div class="home-box hb-green"><div class="home-inner" id="base-green"></div></div>
      <div class="home-box hb-blue"><div class="home-inner" id="base-blue"></div></div>
      <div class="home-box hb-yellow"><div class="home-inner" id="base-yellow"></div></div>
      <div class="center-finish"></div>
    </div>

    <div class="controls-bar">
      <div>
        <div id="turnLabel" style="font-size:16px; font-weight:bold;">Tayaar rahein...</div>
        <div id="statusMsg" style="font-size:12px; color:#94a3b8;"></div>
      </div>
      <button id="diceBtn" class="dice-btn" onclick="rollDice()">🎲 --</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW error:', err));
    }

    const socket = io();
    let myColor = 'red';
    let currentTokens = {};
    let isMyTurn = false;

    // Audio SFX Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'step') {
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'dice') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      }
    }

    function startAI() {
      const name = document.getElementById('nameInput').value.trim() || 'Player 1';
      socket.emit('createBotGame', { playerName: name });
    }

    function createRoom() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return alert('Kripya apna naam likhein!');
      socket.emit('createRoom', { playerName: name });
    }

    function joinRoom() {
      const name = document.getElementById('nameInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      if (!name || !code) return alert('Naam aur Room code dono bharein!');
      socket.emit('joinRoom', { playerName: name, roomCode: code });
    }

    function rollDice() {
      if (!isMyTurn) return;
      playSound('dice');
      socket.emit('rollDice');
    }

    // Socket Event Handlers
    socket.on('gameStarted', (data) => {
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('gameArea').style.display = 'flex';
      myColor = data.myColor || 'red';
      currentTokens = data.tokens;
      renderTokens();
      updateTurn(data.activeColor);
    });

    socket.on('diceRolled', (data) => {
      document.getElementById('diceBtn').innerText = '🎲 ' + data.roll;
      if (data.message) {
        document.getElementById('statusMsg').innerText = data.message;
      }
    });

    socket.on('turnChanged', (data) => {
      currentTokens = data.tokens;
      renderTokens();
      updateTurn(data.activeColor);
    });

    socket.on('tokenMoved', (data) => {
      playSound('step');
      currentTokens = data.tokens;
      renderTokens();
      updateTurn(data.activeColor);
    });

    function updateTurn(activeColor) {
      isMyTurn = (activeColor === myColor);
      const label = document.getElementById('turnLabel');
      label.innerHTML = `Baari: <b style="color:var(--${activeColor})">${activeColor.toUpperCase()}</b>`;
      const btn = document.getElementById('diceBtn');
      btn.disabled = !isMyTurn;
      btn.style.opacity = isMyTurn ? '1' : '0.5';
    }

    function renderTokens() {
      // Clear all home slots
      ['red', 'green', 'yellow', 'blue'].forEach(c => {
        const base = document.getElementById(`base-${c}`);
        base.innerHTML = '';
        if (currentTokens[c]) {
          currentTokens[c].forEach((t, idx) => {
            if (t.step === -1) {
              const pin = document.createElement('div');
              pin.className = `pin pin-${c}`;
              pin.onclick = () => { if (isMyTurn && c === myColor) socket.emit('moveToken', { tokenIndex: idx }); };
              base.appendChild(pin);
            }
          });
        }
      });
    }

    // Winner Rank & GameOver Modal
    socket.on('playerRanked', ({ color, name, rank }) => {
      const suffixes = ['1st 🏆', '2nd 🥈', '3rd 🥉'];
      alert(`${name} (${color.toUpperCase()}) ne 4 gotiyan home kar li hain aur ${suffixes[rank - 1] || rank} position haasil ki!`);
    });

    socket.on('gameOver', ({ winners, loser }) => {
      let resultHtml = `<h2>🎮 Khel Khatam!</h2><div style="font-size:16px; margin: 15px 0;">`;
      const ranks = ['1st Winner 🥇', '2nd Winner 🥈', '3rd Winner 🥉'];
      winners.forEach((p, idx) => {
        resultHtml += `<p style="color:#22c55e; font-weight:bold;">${ranks[idx]}: ${p.name} (${p.color.toUpperCase()})</p>`;
      });
      if (loser) {
        resultHtml += `<p style="color:#ef4444; font-weight:bold; margin-top:15px; border-top:1px dashed #64748b; padding-top:10px;">❌ Looser: ${loser.name} (${loser.color.toUpperCase()})</p>`;
      }
      resultHtml += `</div><button onclick="location.reload()" style="padding:10px 20px; background:#3b82f6; color:white; border:none; border-radius:8px; cursor:pointer;">Play Again</button>`;

      const modal = document.createElement('div');
      modal.style = "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; color:white; padding:25px; border-radius:15px; box-shadow:0 0 25px rgba(0,0,0,0.8); text-align:center; z-index:9999; min-width:280px; border:2px solid #eab308;";
      modal.innerHTML = resultHtml;
      document.body.appendChild(modal);
    });
  </script>
</body>
</html>
